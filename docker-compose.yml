services:
  gateway-whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-whatsapp-bot
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - API_KEY=eeja_wa_gateway_secret_key_2026
      - SESSION_DIR=/app/sessions
      # ─── Multi-Project Webhook URLs ───────────────────────────────────────
      # Comma-separated. Gateway broadcasts every command to ALL URLs.
      # Add a new project by appending its webhook URL here.
      # Example: "http://project-a-api:3000/api/v1/whatsapp/webhook,http://project-b-api:3000/api/whatsapp/webhook"
      - WEBHOOK_URLS=http://job-tracker-api:3000/api/v1/whatsapp/webhook,http://finance-tracker-api:3000/api/whatsapp/webhook
      # ─── Whitelisted senders (comma-separated phone numbers, no +) ────────
      # Self-chat is always allowed. Others must be listed here or in code.
      - ALLOWED_SENDERS=6287700288297,6281288092766
    volumes:
      - wa-sessions-data:/app/sessions
    networks:
      - homelab

networks:
  homelab:
    external: true

volumes:
  wa-sessions-data:
    driver: local
