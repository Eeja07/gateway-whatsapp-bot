name: CI/CD Pipeline - Central WhatsApp API Gateway

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Test, Lint & Build Verification
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

  deploy-homelab:
    name: Deploy to Homelab Container
    needs: [lint-and-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Docker Service
        run: |
          echo "🚀 [CI/CD] Starting Central WhatsApp API Gateway Deployment on Homelab..."

          # 1. Ensure homelab directory hierarchy exists
          mkdir -p /opt/apps/gateway-whatsapp-bot
          mkdir -p /opt/homelab/compose/gateway-whatsapp-bot

          # 2. Sync latest source code to /opt/apps/gateway-whatsapp-bot
          echo "📦 Syncing source code to /opt/apps/gateway-whatsapp-bot..."
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'sessions' \
            ./ /opt/apps/gateway-whatsapp-bot/

          # 3. Sync Compose configuration
          echo "⚙️ Syncing Compose config..."
          cp docker/compose.yml /opt/homelab/compose/gateway-whatsapp-bot/compose.yml

          # 4. Build and restart Docker container
          echo "🐳 Building and updating container..."
          cd /opt/homelab/compose/gateway-whatsapp-bot
          docker compose up -d --build --remove-orphans

          # 5. Verify container status
          echo "🔍 Checking container status..."
          docker ps --filter "name=wa-gateway-bot" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "✅ [CI/CD] Central WhatsApp Gateway Deployed Successfully on Homelab!"
