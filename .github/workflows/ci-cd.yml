name: CI/CD Pipeline - Central WhatsApp API Gateway

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

  deploy-to-server:
    needs: build-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Remote Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          script: |
            mkdir -p /opt/apps/gateway-whatsapp-bot
            cd /opt/apps/gateway-whatsapp-bot
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone git@github.com:Eeja07/gateway-whatsapp-bot.git .
            fi
            docker compose down || true
            docker compose build
            docker compose up -d
